# Lokalne środowisko Rynku: Redis (limity zapytań w api-gateway), PostgreSQL (osobna baza na serwis)
# i SeaweedFS jako magazyn S3 dla media-service.
# Uruchomienie: docker compose -f local/docker-compose.yml up -d
name: rynek

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      # Konto administratora tylko do lokalnej pracy. Serwisy łączą się własnymi kontami z postgres/init.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Magazyn S3-kompatybilny (media-service). Klucze i anonimowy odczyt kubełka publicznego: seaweedfs/s3.json.
  # Kubełki i CORS zakłada media-service przy starcie.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

volumes:
  postgres-data:
  seaweedfs-data:
